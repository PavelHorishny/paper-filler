app:
  documents:
    - { id: karta, template: Informacja (karta) APT.docx, required: false,
        output-name: "{{name}} {{surname}}_karta_{{fulfilmentDate}}" }
    - { id: NIE POB. ZALICZEK, template: NIE POB. ZALICZEK.docx, required: false,
        output-name: "{{name}}{{surname}}_NIE POB. ZALICZEK_{{fulfilmentDate}}" }
    - { id: Nowa Anketa SP. Z O.O., template: Nowa Anketa SP. Z O.O. (1).docx, required: false,
        output-name: "{{name}}{{surname}}_Nowa Anketa SP. Z O.O._{{fulfilmentDate}}" }
    - { id: OSWI. ZLEC. NIE STUDENT, template: OSWI. ZLEC. NIE STUDENT (4).docx, required: false,
        output-name: "{{name}}{{surname}}_OSWI. ZLEC. NIE STUDENT_{{fulfilmentDate}}" }
    - { id: Oświadczenie_o_stanie_zdrowia, template: Oświadczenie_o_stanie_zdrowia_wzór (wersja w jęz. polskim) (1).docx, required: false,
        output-name: "{{name}}{{surname}}_Oświadczenie_o_stanie_zdrowia_{{fulfilmentDate}}" }
    - { id: oswiadczenie-sp zoo, template: oswiadczenie-sp zoo (6) (1).docx, required: false,
