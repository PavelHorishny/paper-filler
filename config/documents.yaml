    - { id: Oświadczenie studenta APT, template: Oświadczenie studenta APT.docx, required: false,
        output-name: "{{name}}{{surname}}_Oświadczenie studenta APT_{{fulfilmentDate}}" }
    - { id: PPK APT, template: PPK APT.docx, required: false,
        output-name: "{{name}}{{surname}}_PPK APT_{{fulfilmentDate}}" }
    - { id: PPK APT 2, template: PPK APT 2.docx, required: false,
        output-name: "{{name}}{{surname}}_PPK APT 2_{{fulfilmentDate}}" }
    - { id: Rodo APT, template: Rodo APT.docx, required: false,
        output-name: "{{name}}{{surname}}_Rodo APT_{{fulfilmentDate}}" }
    - { id: UMOWA ZOO new (2), template: UMOWA ZOO new (2).docx, required: false,
        output-name: "{{name}}{{surname}}_UMOWA ZOO new (2)_{{fulfilmentDate}}" }
    - { id: Wniosek konto sp. z o.o. sp. kom. (2), template: Wniosek konto sp. z o.o. sp. kom. (2).docx, required: false,
