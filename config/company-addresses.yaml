# Фирменные адреса для формы (режим «Фирменное»).
# Файл потом кладётся в config/company-addresses.yaml.
#
# Правила:
#   - отступы только пробелами (по 2), без Tab
#   - каждый адрес начинается с "- id:"
#   - id: латиница, без пробелов, слова через дефис, уникальный
#   - номер дома / квартиры / индекс — в кавычках
#   - tax-office: FIRST / SECOND / THIRD (Pierwszy / Drugi / Trzeci US w Szczecinie)
#   - needs-apartment: true — если квартиру/комнату вписывают руками, иначе false
#   - apartment: заполнить, только если номер квартиры всегда один и тот же, иначе ""
#   - пустые поля оставляй как ""
#   - нужен ещё адрес — скопируй блок целиком (от "- id:" до "needs-apartment:")

app:
  company-addresses:

    - id: "AMK"                  # например: szczecin-wojska-1
      label: "Małkowskiego"               # текст в выпадающем списке, например: "Szczecin, Wojska Polskiego 1 — общежитие"
      region: "Zachodniopom."   # województwo
      district: "Szczecin"            # powiat
      commune: "Szczecin"             # gmina
      city: "Szczecin"                # miejscowość
      street: "A. Małkowskiego"              # улица — как пишете в форме
      house: "18"               # номер дома
      apartment: "9"           # квартира (если всегда одна и та же)
      postal-code: "70-306"         # индекс, например "70-001"
      tax-office: "SECOND"          # FIRST / SECOND / THIRD
      needs-apartment: false  # true / false

    - id: "JG74"
      label: "Jagiellońska 74"
      region: "Zachodniopom."
