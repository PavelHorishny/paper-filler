<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap">
</head>
<body>
<div th:replace="~{fragments/header :: header(false)}"></div>

<main class="page-main">
    <div class="status-page">
        <section class="status-card">
            <div class="status-icon status-icon--error" aria-hidden="true">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h1>Что-то пошло не так</h1>
            <p>Попробуйте ещё раз — если ошибка повторится, сообщите администратору.</p>
            <p class="status-note">Something went wrong. Please try again.</p>
            <div class="status-actions">
                <a th:href="@{/}" class="btn btn-primary">На главную</a>
                <button type="button" class="btn btn-secondary" onclick="history.back()">Назад</button>
            </div>
        </section>
    </div>
</main>
</body>
</html>
