<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Paper Filler</title>
</head>
<body>
<form th:action="@{/}" th:object="${clientForm}" method="post">
    <p>
        <label>Имя</label><br>
        <input type="text" th:field="*{name}">
    </p>
    <p>
        <label>Фамилия</label><br>
        <input type="text" th:field="*{surname}">
    </p>
    <p>
        <label>Телефон</label><br>
        <input type="text" th:field="*{phoneNumber}">
    </p>
        <p>
        <label>Viber</label><br>
        <input type="text" th:field="*{viber}">
    </p>
    <p>
        <label>E-mail</label><br>
        <input type="text" th:field="*{email}">
    </p>
    <p>
        <label>PESEL</label><br>
        <input type="text" th:field="*{pesel}">
    </p>
    <p>
        <label>Паспорт</label><br>
        <input type="text" th:field="*{passport}">
    </p>
    <p>
        <label>Номер счёта</label><br>
        <input type="text" th:field="*{account}">
    </p>
    <p>
        <label>Налоговая</label><br>
        <input type="text" th:field="*{taxOffice}">
    </p>
        <p>
        <label>Дата рождения</label><br>
        <input type="date" th:field="*{birthDate}">
    </p>
        <p>
        <label>Дата исполнения</label><br>
        <input type="date" th:field="*{fulfilmentDate}">
    </p>
    <button type="submit">Отправить</button>

    <p>
        <label>Гражданство</label><br>
        <label th:each="c : ${citizenships}">
            <input type="radio" th:field="*{citizenship}" th:value="${c}">
            <span th:text="${c.label}"></span>
        </label>
    </p>
</form>
</body>
</html>
