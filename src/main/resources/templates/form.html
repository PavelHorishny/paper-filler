<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <link rel = "stylesheet" th:href = "@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap">
    <meta charset="UTF-8">
    <title>Paper Filler</title>
</head>
<body>
<div th:replace="~{fragments/header :: header(true)}"></div>

<dialog id="whatsNew" th:if="${release != null}" th:data-version="${release.version}">
    <h2>Что нового в версии <span th:text="${release.version}">0.0.0</span></h2>
    <ul>
        <li th:each="note : ${release.notes}" th:text="${note}">пункт</li>
    </ul>
    <button type="button" id="whatsNewClose">Понятно</button>
</dialog>

<main class="page-main">
    <form th:action="@{/}" th:object="${clientForm}" method="post">
    <fieldset>
        <p>
            <label>Гражданство</label><br>
            <label th:each="c : ${citizenships}">
                <input type="radio" th:field="*{citizenship}" th:value="${c}" required
                    th:data-series = "${c.seriesPattern}"
                    th:data-number = "${c.numberPattern}">
                <span th:text="${c.label}"></span>
            </label>
        </p>
        <div class="personal-data">
            <div>
                <label>Имя</label><br>
                <label>
                    <input type="text" th:field="*{name}">
                </label>
            </div>
            <div>
                <label>Фамилия</label><br>
                <label>
                    <input type="text" th:field="*{surname}">
                </label>
            </div>
            <div>
                <label>Дата рождения</label><br>
                <label>
                    <input type="date" th:field="*{birthDate}">
                </label>
            </div>
            <div id="student-row" class="checkbox-cell" hidden>
                <label>
                    <input type="checkbox" th:field="*{student}"> Студент
                </label>
            </div>
        </div>

        <div class="personal-data">
            <div>
                <label>Серия</label><br>
                <label>
                    <input type="text" class="short" th:field="*{passport.series}" id="passportSeries">
                </label>
            </div>
            <div>
                <label>Номер паспорта</label><br>
                <label>
                    <input type="text" th:field="*{passport.number}" id="passportNumber" inputmode="numeric">
                </label>
            </div>
            <div>
                <label>PESEL</label><br>
                <label>
                    <input type="text" th:field="*{pesel}"
                        pattern="\d{11}" maxlength="11" inputmode="numeric"
                        title="PESEL must contain 11 digits">
                </label>
            </div>
        </div>
        <div class="personal-data">
            <div>
                <label>Номер счёта</label><br>
                <label>
                    <input type="text" class="wide" th:field="*{account}"
                        pattern="\d{2}( \d{4}){6}" maxlength="32" inputmode="numeric"
                        title="26 digits, e.g. 61 1090 1014 0000 0712 1981 2874">
                </label>
            </div>
            <div>
                <label>Bank</label><br>
                <input type="text" class="wide" th:field="*{bank}" id="bank">
            </div>
        </div>

        <div class="personal-data">
            <div>
                <label>Телефон</label><br>
                <label>
                    <input type="text" th:field="*{phoneNumber}">
                </label>
            </div>
            <div>
                <label>Viber</label><br>
                <label>
                    <input type="text" th:field="*{viber}">
                </label>
            </div>
            <div>
                <label>E-mail</label><br>
                <label>
                    <input type="text" th:field="*{email}">
                </label>
            </div>
        </div>
    </fieldset>
    <fieldset>
        <legend>Домашний адрес</legend>

        <div class="row">
            <div>
                <label>Województwo</label><br>
                <input type="text" th:field="*{homeAddress.region}">
            </div>
            <div>
                <label>Powiat</label><br>
                <input type="text" th:field="*{homeAddress.district}">
            </div>
            <div>
                <label>Gmina</label><br>
                <input type="text" th:field="*{homeAddress.commune}">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Индекс</label><br>
                <input type="text" class="postal" th:field="*{homeAddress.postalCode}">
            </div>
            <div>
                <label>Город</label><br>
                <input type="text" th:field="*{homeAddress.city}">
            </div>
            <div>
                <label>Улица</label><br>
                <input type="text" th:field="*{homeAddress.street}">
            </div>
            <div>
                <label>Дом</label><br>
                <input type="text" class="short" th:field="*{homeAddress.house}">
            </div>
            <div>
                <label>Кв.</label><br>
                <input type="text" class="short" th:field="*{homeAddress.apartment}">
            </div>
        </div>
        <div class="row">
            <div>
                <label>Место рождения</label><br>
                <input type="text" class="wide" th:field="*{birthPlace}" autocomplete="off">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Польский адрес</legend>
        <label><input type="radio" th:field="*{companyHousing}" th:value="true"> Фирменное жильё</label>
        <label><input type="radio" th:field="*{companyHousing}" th:value="false"> Своё жильё</label>
    </fieldset>

    <fieldset id="company-address">
        <legend>Фирменное жильё</legend>
        <div class="row">
            <div>
                <label>Адрес</label><br>
                <select th:field="*{companyAddressId}" required>
                    <option value="">—</option>
                    <option th:each="a : ${companyAddresses}"
                            th:value="${a.id()}"
                            th:text="${a.label()}"
                            th:data-needs-apartment="${a.needsApartment()}"></option>
                </select>
            </div>
            <div id="company-apartment" hidden>
                <label>Кв./комната</label><br>
                <input type="text" class="short" th:field="*{companyApartment}">
            </div>
        </div>
    </fieldset>

    <fieldset id="own-address">
        <legend>Своё жильё</legend>

        <div class="row">
            <div>
                <label>Województwo</label><br>
                <input type="text" th:field="*{localAddress.region}">
            </div>
            <div>
                <label>Powiat</label><br>
                <input type="text" th:field="*{localAddress.district}">
            </div>
            <div>
                <label>Gmina</label><br>
                <input type="text" th:field="*{localAddress.commune}">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Индекс</label><br>
                <input type="text" class="postal" th:field="*{localAddress.postalCode}">
            </div>
            <div>
                <label>Город</label><br>
                <input type="text" th:field="*{localAddress.city}" autocomplete="off">
            </div>
            <div>
                <label>Улица</label><br>
                <input type="text" th:field="*{localAddress.street}" autocomplete="off">
            </div>
            <div>
                <label>Дом</label><br>
                <input type="text" class="short" th:field="*{localAddress.house}">
            </div>
            <div>
                <label>Кв.</label><br>
                <input type="text" class="short" th:field="*{localAddress.apartment}">
            </div>
        </div>
        <div class="row">
            <div>
                <label>Urząd skarbowy</label><br>
                <select th:field="*{taxOffice}">
                    <option value="">—</option>
                    <option th:each="t : ${taxOffices}" th:value="${t}" th:text="${t.label}"></option>
                </select>
            </div>
        </div>
    </fieldset>
    <fieldset id="school-block" hidden>
        <legend>Учебное заведение</legend>
        <div class="row">
            <div>
                <label>Название</label><br>
                <input type="text" class="wide" th:field="*{schoolName}">
            </div>
        </div>
    </fieldset>

    <button type="submit">Отправить</button>
</form>
</main>
<script th:src="@{/js/form.js}"></script>
</body>
</html>
