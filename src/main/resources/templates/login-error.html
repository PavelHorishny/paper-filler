<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap">
</head>
<body>

<div th:if="${param.denied}">
    <h2>Нет доступа</h2>
    <p>Этот Google-аккаунт не добавлен в список пользователей. Обратитесь к администратору.</p>
</div>

<div th:unless="${param.denied}">
    <h2>Сессия закончилась</h2>
    <p>Войдите ещё раз — это займёт пару секунд.</p>
</div>

<p><a th:href="@{/}">Войти снова</a></p>

</body>
</html>
