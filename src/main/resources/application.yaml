spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,email,profile
  application:
    name: paper-filler
  config:
    import: "file:./config/documents.yaml, file:./config/banks.yaml"

app:
  allowed-emails: ${ALLOWED_EMAILS:}
  templates-dir: ./templates
  release:
    version: 0.2.0
    notes:
      - "Проверка полей прямо в форме: PESEL, номер счёта, паспорт"
      - "PESEL проверяется по к-ву цифр, если не хватает подсвечивает красным, больше ввести не дает"
      - "Номер счета так же"
      - "проверка паспорта зависит от выбора гражданства, серию можно писать маленькими, автоматом поставит заглавными"
      - "И тут для тебя задание - посмотри паспорта не наших, и проверь сколько букв и цифр в их паспортах"
      - "Номер счёта делится на блоки:"
      - "если пишешь руками пробелы проставляются сами"
      - "если копируешь, то не парься как бы криво тебе его не прислали он должен нормально вписатся и разбиться на блоки"
      - "можешь вставлять и с буквами вначале счета, они уберутся автоматически"
      - "!!!Всеравно проверяй!!!"
      - "Банк подставляется автоматически по номеру счёта"
      - "Сейчас это полу хард код, поэтому уточняй у них точно ли этот банк"
      - "можно вписать и руками, на крайний случай"
      - "Понятная страница ошибки"
      - "Это тебе не надо, но оно есть"
      - "И еще одно задание - посмотри как данные вставляются в документ, может где-то будет кривой или смещенный текст"
      - "В один документ, к сожалению, собрать пока не получается, очень уж кривые эти шаблоны"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: PAPERFILLER_SESSION

logging:
  level: 
    org.springframework.security: INFO
