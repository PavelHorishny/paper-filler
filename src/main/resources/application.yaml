spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,email,profile
  application:
    name: paper-filler
  config:
    import: "file:./config/documents.yaml, file:./config/banks.yaml"

app:
  allowed-emails: ${ALLOWED_EMAILS:}
  templates-dir: ./templates
  release:
    version: 0.2.0
    notes:
      - "Проверка полей прямо в форме: PESEL, номер счёта, паспорт"
      - "Номер счёта делится на блоки"
      - "Банк подставляется автоматически по номеру счёта"
      - "Понятная страница ошибки"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: PAPERFILLER_SESSION

logging:
  level: 
    org.springframework.security: INFO
