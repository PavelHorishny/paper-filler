spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,email,profile
  application:
    name: paper-filler
  config:
    import: "file:./config/documents.yaml, file:./config/banks.yaml, file:./config/company-addresses.yaml"

app:
  allowed-emails: ${ALLOWED_EMAILS:}
  templates-dir: ./templates
  release:
    version: 0.4.0
    notes:
      - "Фирменное жильё: выбери адрес из списка — адрес и urząd подставятся сами"
      - "Для Brzechwy 4 и 6 появляется поле квартиры/комнаты"
      - "Своё жильё: подсказки города и улицы (zachodniopomorskie), gmina и powiat заполняются сами"
      - "Можно печатать без польских букв: swinou → Świnoujście"
      - "Если сессия закончилась — понятная страница и кнопка «Войти снова»"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: PAPERFILLER_SESSION

logging:
  level: 
    org.springframework.security: INFO
