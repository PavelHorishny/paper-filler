spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,email,profile
  application:
    name: paper-filler
  config:
    import: "file:./config/documents.yaml, file:./config/banks.yaml, file:./config/company-addresses.yaml"

app:
  allowed-emails: ${ALLOWED_EMAILS:}
  nova-poshta-key: ${NOVA_POSHTA_API_KEY:}
  templates-dir: ./templates
  release:
    version: 0.5.0
    notes:
      - "Индекс подставляется сам после ввода номера дома (польский адрес)"
      - "Urząd skarbowy для Щецина выбирается сам по улице и номеру дома — проверяй, можно поменять"
      - "Украина: подсказки города, области и улицы для домашнего адреса"
      - "Место рождения — подсказки городов Украины"
      - "Можно искать по-русски: «Харьков» → Харків, в документах будет Kharkiv"
      - "Новая анкета для обеих фирм"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: PAPERFILLER_SESSION

logging:
  level: 
    org.springframework.security: INFO
