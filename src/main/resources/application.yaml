spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: openid,email,profile
  application:
    name: paper-filler
  config:
    import: "file:./config/documents.yaml, file:./config/banks.yaml, file:./config/company-addresses.yaml"

app:
  allowed-emails: ${ALLOWED_EMAILS:}
  templates-dir: ./templates
  release:
    version: 0.3.0
    notes:
      - "Пробел между именем и фамилией в анкете"
      - "Добавлены документы"
      - "Добавлен выбор спулки"
      - "Можно выбирать обе сразу"
      - "Документы общие показаны сразу"
      - "Обязательные уже отмечены галочкой"
      - "После генерации в архиве поделены по папкам"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: PAPERFILLER_SESSION

logging:
  level: 
    org.springframework.security: INFO
